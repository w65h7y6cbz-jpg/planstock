# PlanStock — Worker Cloudflare + base D1.
#
# L'application ne tourne plus sur un PC du magasin : le Worker sert l'interface
# compilée (web/dist) et l'API, la base vit dans D1. La contrepartie assumée :
# sans Internet, PlanStock est inaccessible.

name = "planstock"
main = "worker/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Pas de seconde adresse en .workers.dev : une seule porte d'entrée à retenir,
# et rien qui traîne sous un nom devinable. (En TOML, cette clé doit rester
# au-dessus de la première table : après `[[routes]]`, elle appartiendrait à la
# route et non au Worker.)
workers_dev = false

# L'adresse de PlanStock. « Domaine personnalisé » et non « route » : le Worker
# est l'origine, il n'y a pas de serveur derrière. Cloudflare crée
# l'enregistrement DNS et le certificat tout seul au premier déploiement.
#
# Un sous-domaine, jamais l'apex : lifepilot.win sert déjà l'application
# LifePilot. PlanStock ne prend que ce nom-ci et ne touche à rien d'autre.
[[routes]]
pattern = "planstock.lifepilot.win"
custom_domain = true

# L'interface compilée est servie directement par le réseau Cloudflare, sans
# passer par le Worker. `run_worker_first` réserve /api au Worker, sinon le
# repli « application d'une seule page » renverrait index.html pour l'API.
[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# La base est créée en région Océanie : c'est la plus proche de Nouméa.
[[d1_databases]]
binding = "DB"
database_name = "planstock"
database_id = "92c33a94-4add-4f1a-8314-f8676167de2b"
migrations_dir = "migrations"

[vars]
# Adresses IP publiques autorisées, séparées par des virgules. Vide = filtrage
# désactivé (tout le monde entre) : à ne laisser vide que le temps du premier
# réglage. Se modifie sans redéployer :
#   npx wrangler secret put PLANSTOCK_ALLOWED_IPS
PLANSTOCK_ALLOWED_IPS = ""

[observability]
enabled = true
